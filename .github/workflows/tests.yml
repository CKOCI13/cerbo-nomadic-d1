# Runs the test suite on GitHub's computers every time something is pushed or proposed,
# so anyone can see at a glance (the badge in README.md) that the code still works.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Venus OS ships Python 3; the driver sticks to the standard library and avoids newer syntax.
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the tests
        run: python -m unittest discover -s tests -v
