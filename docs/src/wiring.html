<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wiring figures</title>
<!-- The wiring pictures in docs/images. build-wiring.cjs renders every element with a data-figure
     attribute to docs/images/<name>.png at 2x scale. The same file is used in all four repositories:
     only data-model on <body> differs (D1 or D2). {M} in the text becomes the model; elements with
     class "d1" or "d2" only appear for that model. -->
<style>
  body { margin: 0; background: #888; font-family: Inter, "DejaVu Sans", sans-serif; color: #111827; }
  [data-figure] { background: #fff; margin: 20px; display: block; }
  svg text { font-family: Inter, "DejaVu Sans", sans-serif; fill: #111827; }
  .h { font-size: 20px; font-weight: 700; }
  .b { font-size: 16px; font-weight: 700; }
  .t { font-size: 15px; }
  .s { font-size: 13px; fill: #4b5563; }
  .w { fill: #fff; }
  .ws { fill: #c7d0dc; font-size: 14px; }
  .res { fill: #b85c00; }
  .red { fill: #c9403a; }
  .dim { fill: #9aa3ae; }
</style>
</head>
<body data-model="D1">
<svg width="0" height="0" style="position:absolute">
  <defs>
    <pattern id="wb" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="12" height="12" fill="#fff"/><rect width="6" height="12" fill="#8a5a2b"/></pattern>

    <g id="wago">

      <rect x="18" y="14" width="44" height="64" rx="8" fill="#f28c28"/>
