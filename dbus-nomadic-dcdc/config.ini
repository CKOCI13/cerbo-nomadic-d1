; Nomadic D1 DC-DC converter driver - settings
; Restart the driver after editing:  svc -t /service/dbus-nomadic-dcdc

[can]
; CAN port the converter is wired to. auto = listen on every CAN port and use the one the
; converter is heard on (nothing is sent until then). Port names differ between Cerbo models
; (can0/can1, or vecan0/vecan1 on the Cerbo GX MK2), so leave this on auto unless you need to
; force a port. The bitrate is set by the GX CAN-bus port profile and must match the converter.
interface = auto
; Seconds without frames before the converter is shown as offline
timeout = 1.0

[control]
; What the Cerbo does after every start or reboot:
;   auto = Automatic (see "automatic" below). Recommended.
;   off  = command the converter off
;   last = go back to whatever was selected before the restart
startup = auto
; What Automatic means:
;   limited   = the Cerbo picks buck, boost or standby by the D1 manual's own rules
;               (buck below 12.5 V, boost from 13.5 V until 12.3 V, standby between) and
;               sends the current limits below with it, so the 12 V cable stays within them.
;               Owners never need to choose Buck or Boost. Recommended, and needed on a
;               stock LTV1.
;   hands_off = send no commands: the D1 runs on its own built-in logic at its factory
;               limits (up to 178 A buck, about 200 A from the 12 V side boosting),
;               exactly as without the Cerbo.
; If the Cerbo stops sending (restart, firmware update, CAN cable off), the D1 is left to its own
; logic and factory limits; the Safe Test Plan's hand-back test shows what yours does.
automatic = limited
; Minimum OFF time when reversing between buck and boost, in seconds
direction_change_delay = 1.0
; While testing: Buck or Boost switches to Off by itself after this many minutes,
; so a test can never be left running. 0 = never (normal use).
test_timer = 0

; Limits for every command (Cerbo screen, VRM, web page, D-Bus, MQTT, Node-RED).
; The defaults are the D1 manual's adjustable ranges (Rev D, "Configurable Parameters").
; Tighten them to what your batteries, wiring and fuses can take (current limits: see below).
buck_voltage_min = 10.0
buck_voltage_max = 13.5
boost_voltage_min = 42.0
boost_voltage_max = 57.8
; Current limits, in amps. buck = 12 V side output (D1 max 178 A); boost = 48 V side output (D1 max 57 A).
; Boosting, the 12 V side carries about 5 x the boost amps at worst (48 V-side V / 12 V-side V / 0.92).
; The defaults suit a stock Grand Design LTV1: 2 AWG cable on a 150 A fuse, kept to 80 % = 120 A:
;   buck 120 A on the 12 V side; boost 23 A on the 48 V side (about 118 A on the 12 V side at worst).
; Only raise them if your cable and fuse are sized for more (see "Limiting current" in README.md).
; The D1's own factory limits are 178 A and 57 A.
buck_current_limit_max = 120
boost_current_limit_max = 23

; Values sent when you choose Buck or Boost (changes made later are saved in state.json).
; Buck: 12 V side target. 13.5 V charges the chassis batteries properly (D1 maximum).
; Boost: 48 V side target. Set it to your 48 V battery's charge voltage
; (55.2 V = 3.45 V/cell for a 16-cell LiFePO4).
buck_voltage = 13.5
boost_voltage = 55.2
buck_current_limit = 100
boost_current_limit = 20
; 24..54 V (only used if you request precharge)
precharge_voltage = 48.0

[dbus]
; dcdc = show up as a DC-DC converter in the GX device list and VRM
service_class = dcdc
device_instance = 70
custom_name = DC-DC D1
; seconds between D-Bus updates
update_interval = 1.0
; yes = show readings and controls in the GX switch pane, the GX device page and the
; VRM Switches panel / app widget (needs Venus OS v3.80 or newer)
switch_pane = yes

[web]
; Web page for monitoring and control: http://<gx-ip>:8088   (port = 0 disables it)
port = 8088
bind = 0.0.0.0
; Optional password for the web page (any user name). Empty = no password:
; anyone on your network can then operate the converter.
password =
